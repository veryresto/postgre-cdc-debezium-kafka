services:
  # Source Database (AI-MASTER-DB)
  # Role: System of Record
  pgsource:
    image: postgres:14
    container_name: pgsource
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: sourcepass
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
    volumes:
      - pgsource_data:/var/lib/postgresql/data

volumes:
  pgsource_data:
