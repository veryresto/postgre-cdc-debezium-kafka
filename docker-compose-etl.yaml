services:
  # Spark & MinIO (AI-ETL)
  # Role: Compute + Data Engineering Brain

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
        mode: host
      # Mapping 9001 just in case later versions are used or it's needed, 
      # though valid config for this old image focuses on 9000.
      - target: 9001
        published: 9001
        protocol: tcp
        mode: host
    environment:
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
    command: server /data --console-address ":9001"
    restart: unless-stopped
    volumes:
      - minio_data:/data

  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark
    depends_on:
      - minio
    environment:
      SPARK_MODE: master
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      # Spark will need to connect to:
      # 1. MinIO: 'minio:9000' (local service)
      # 2. Kafka: '${LANDING_DB_HOST}:9092' (remote or host IP)
    volumes:
      - ./spark:/opt/spark-apps
    command: tail -f /dev/null
    ports:
      - "4040:4040"

  trino:
    image: trinodb/trino:451
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc:/etc/trino
    depends_on:
      - minio

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    environment:
      SERVICE_NAME: metastore
    ports:
      - "9083:9083"
    volumes:
      - ./hive/conf:/opt/hive/conf
      - ./hive/lib/hadoop-aws-3.3.6.jar:/opt/hive/lib/hadoop-aws-3.3.6.jar
      - ./hive/lib/aws-java-sdk-bundle-1.12.367.jar:/opt/hive/lib/aws-java-sdk-bundle-1.12.367.jar
    depends_on:
      - minio

volumes:
  minio_data:
